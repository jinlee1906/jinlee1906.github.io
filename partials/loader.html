  <!-- ===== LOADING SCREEN (homepage, once per visit): liquid runs through a process flow

        <rect x="1268" y="284" width="52" height="69" rx="6"/>
        <path d="M1258,298 H1330 M1258,339 H1330 M1294,353 V655"/>
        <g class="impeller" style="--d:2.45s">
          <ellipse cx="1260" cy="655" rx="35" ry="14"/>
          <ellipse cx="1328" cy="655" rx="35" ry="14"/>

        <path d="M1572,470 C1572,414 1677,414 1677,470 V645 C1677,701 1572,701 1572,645 Z M1572,470 H1677 M1572,645 H1677"/>

  </div>
  <script>
    (function () {
      var root = document.documentElement, loader = document.querySelector('.loader');
      // welcome-page entrance: split the name into letters and the description into words so
      // they can rise in one after another, then swap hero-wait for hero-in (style.css)
      function heroIn() {
        var name = document.querySelector('.hero-name'), sub = document.querySelector('.hero-subtitle');
        if (name && !name.dataset.split) {
          name.dataset.split = '1';
          name.setAttribute('aria-label', name.textContent);
          name.innerHTML = name.textContent.split('').map(function (c, i) {
            return '<span class="ch" aria-hidden="true" style="--i:' + i + '">' + (c === ' ' ? '&nbsp;' : c) + '</span>';
          }).join('');
        }
        if (sub && !sub.dataset.split) {
          sub.dataset.split = '1';
          sub.innerHTML = sub.textContent.trim().split(/\s+/).map(function (w, i) {
            return '<span class="wd" style="--i:' + i + '">' + w + '</span>';
          }).join(' ');
        }
        root.classList.remove('hero-wait');
        root.classList.add('hero-in');
      }
      function whenReady(fn) {
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn); else fn();
      }
      if (!root.classList.contains('is-loading')) {
        loader.remove();
        if (root.classList.contains('hero-wait')) whenReady(function () { requestAnimationFrame(heroIn); });
        return;
      }
      var pct = loader.querySelector('.loader-pct'), bar = loader.querySelector('.loader-bar span');
      var start = performance.now(), FILL = 4500;
      (function tick(now) {
        var p = Math.min(1, (now - start) / FILL);
        pct.textContent = Math.round(p * 100) + '%';
        bar.style.transform = 'scaleX(' + p + ')';
        if (p < 1) requestAnimationFrame(tick);
      })(start);
      // 4.5s the diagram lifts away, 4.75s the curtain slides up over 1.8s (loader.css) while
      // the welcome page plays its entrance underneath, 6.6s the loader is gone
      setTimeout(function () { whenReady(heroIn); }, 5100);
      setTimeout(function () { root.classList.remove('is-loading'); loader.remove(); }, 6600);
    })();
  </script>
